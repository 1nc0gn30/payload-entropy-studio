[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payload-entropy-studio"
version = "0.1.0"
description = "Security Payload Threat Analyzer, Shannon Entropy Profiler & WAF Rule Synthesizer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "1nc0gn30" }
]
keywords = [
    "security",
    "payload-analysis",
    "shannon-entropy",
    "waf",
    "sqli",
    "xss",
    "deobfuscator",
    "mcp",
    "fastmcp",
    "material-3",
    "zero-dependencies",
    "markov",
    "transition-entropy",
    "lsh",
    "simhash",
    "minhash",
    "shellcode",
    "ngram"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
payload-entropy = "payload_entropy_studio.cli:main"
payloadviz = "payload_entropy_studio.cli:main"

[project.urls]
Homepage = "https://github.com/1nc0gn30/payload-entropy-studio"
Repository = "https://github.com/1nc0gn30/payload-entropy-studio"
Issues = "https://github.com/1nc0gn30/payload-entropy-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
